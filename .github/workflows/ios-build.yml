name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'iOS/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в Actions

jobs:
  build-ipa:
    runs-on: macos-26 # macOS на Apple Silicon с предустановленным Xcode 15/16

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project specification
        run: |
          cat << 'EOF' > iOS/project.yml
          name: LersMonitor
          options:
            bundleIdPrefix: com.lersmonitor
            deploymentTarget:
              iOS: "17.0"
          targets:
            LersMonitor:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: .
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.lersmonitor.app
                  INFOPLIST_KEY_CFBundleDisplayName: "LersMonitor"
                  INFOPLIST_KEY_CFBundleIdentifier: "com.lersmonitor.app"
                  GENERATE_INFOPLIST_KEY_CFBundleIdentifier: YES
                  CURRENT_PROJECT_VERSION: 1
                  MARKETING_VERSION: 1.0.0
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          EOF

      - name: Generate .xcodeproj
        working-directory: iOS
        run: xcodegen generate

      - name: Build Application (.app)
        working-directory: iOS
        run: |
          xcodebuild clean build \
            -project LersMonitor.xcodeproj \
            -scheme LersMonitor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        working-directory: iOS
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LersMonitor.app Payload/
          zip -r LersMonitor.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LersMonitor-IPA
          path: iOS/LersMonitor.ipa
          retention-days: 14
