name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'iOS/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Project Spec
        run: |
          cat << 'EOF' > iOS/project.yml
          name: LersMonitor
          options:
            bundleIdPrefix: com.lersmonitor
            deploymentTarget:
              iOS: "17.0"
          targets:
            LersMonitor:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: .
                  excludes:
                    - "project.yml"
                    - "Info.plist"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.lersmonitor.app
                  CURRENT_PROJECT_VERSION: 1
                  MARKETING_VERSION: 1.0.0
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  INFOPLIST_FILE: Info.plist
          EOF

      - name: Generate .xcodeproj
        working-directory: iOS
        run: xcodegen generate

      - name: Build Application (.app)
        working-directory: iOS
        run: |
          xcodebuild clean build \
            -project LersMonitor.xcodeproj \
            -scheme LersMonitor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        working-directory: iOS
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LersMonitor.app"

          # ATS settings are now in Info.plist (included at build time),
          # no need for post-build plist injection.

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r LersMonitor.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LersMonitor-IPA
          path: iOS/LersMonitor.ipa
          retention-days: 14
