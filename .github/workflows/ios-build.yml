name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'iOS/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          # xcbeautify используется в шаге сборки; без него xcodebuild запускался бы дважды
          brew install xcbeautify || echo "WARNING: xcbeautify unavailable, raw build log will be used"

      - name: Install ldid (ad-hoc signer for jailbroken installs)
        run: |
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid || echo "WARNING: ldid install failed, will try manual fallback"
          fi
          ldid 2>&1 | head -2 || true

      - name: Create Project Spec
        run: |
          cat << 'EOF' > iOS/project.yml
          name: LersMonitor
          options:
            bundleIdPrefix: com.lersmonitor
            deploymentTarget:
              iOS: "17.0"
            createIntermediateGroups: true
          targets:
            LersMonitor:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: .
                  excludes:
                    - "project.yml"
                    - "Info.plist"
                    - "build"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.lersmonitor.app
                  PRODUCT_NAME: LersMonitor
                  CURRENT_PROJECT_VERSION: 1
                  MARKETING_VERSION: 1.0.0
                  INFOPLIST_FILE: Info.plist
                  GENERATE_INFOPLIST_FILE: NO
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  ASSETCATALOG_COMPILER_APPICON_NAME: ""
                  ENABLE_BITCODE: NO
          EOF

      - name: Generate .xcodeproj
        working-directory: iOS
        run: xcodegen generate

      - name: Build Application (.app)
        working-directory: iOS
        run: |
          set -o pipefail
          # Один запуск xcodebuild. pipefail сохраняет реальный код завершения,
          # даже если вывод прогнан через xcbeautify.
          ARGS=(
            clean build
            -project LersMonitor.xcodeproj
            -scheme LersMonitor
            -configuration Release
            -sdk iphoneos
            -derivedDataPath build
            CODE_SIGN_IDENTITY=""
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGNING_ALLOWED=NO
            ONLY_ACTIVE_ARCH=NO
            ARCHS=arm64
          )
          if command -v xcbeautify >/dev/null 2>&1; then
            xcodebuild "${ARGS[@]}" | xcbeautify
          else
            xcodebuild "${ARGS[@]}"
          fi

      - name: Verify app bundle contents
        working-directory: iOS
        run: |
          APP="build/Build/Products/Release-iphoneos/LersMonitor.app"
          echo "---- Bundle tree ----"
          ls -la "$APP"
          echo "---- Executable check ----"
          if [ ! -f "$APP/LersMonitor" ]; then
            echo "ERROR: main executable LersMonitor is missing!"
            exit 1
          fi
          file "$APP/LersMonitor"
          echo "---- Info.plist keys ----"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$APP/Info.plist"

      - name: Verify ATS configuration in built bundle
        working-directory: iOS
        run: |
          APP="build/Build/Products/Release-iphoneos/LersMonitor.app"
          echo "---- ATS dump from built Info.plist ----"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$APP/Info.plist" || {
            echo "!!! NSAppTransportSecurity IS MISSING IN THE BUNDLE !!!"
            echo "!!! ATS will block plain HTTP. Aborting build. !!!"
            exit 1
          }
          ALLOW=$(/usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$APP/Info.plist")
          echo "NSAllowsArbitraryLoads = $ALLOW"
          if [ "$ALLOW" != "true" ]; then
            echo "!!! NSAllowsArbitraryLoads is $ALLOW, expected true. Aborting. !!!"
            exit 1
          fi
          echo "ATS configuration verified OK"

      - name: Enforce ATS keys in final bundle (safety net)
        working-directory: iOS
        run: |
          APP="build/Build/Products/Release-iphoneos/LersMonitor.app"
          # Belt-and-braces: force ATS keys into the compiled bundle's Info.plist.
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains dict" "$APP/Info.plist"
          for d in localhost 127.0.0.1 81.200.30.86; do
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:$d dict" "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:$d:NSExceptionAllowsInsecureHTTPLoads bool true" "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:$d:NSIncludesSubdomains bool true" "$APP/Info.plist"
          done
          echo "---- Final ATS state ----"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$APP/Info.plist"
          # Re-sign after touching the plist so the signature covers the modified bundle
          if command -v ldid >/dev/null 2>&1; then
            ldid -S "$APP/LersMonitor"
            echo "Re-signed after plist modification"
          fi

      - name: Package IPA
        working-directory: iOS
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/LersMonitor.app"
          rm -rf Payload LersMonitor.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/

          # Make sure the binary is executable
          chmod +x "Payload/LersMonitor.app/LersMonitor"

          # Ad-hoc sign with ldid (required for jailbroken / Sileo / Zebra installs)
          if command -v ldid >/dev/null 2>&1; then
            ldid -S Payload/LersMonitor.app/LersMonitor
            echo "ldid signature applied"
          else
            echo "ldid unavailable — falling back to codesign ad-hoc"
            codesign --force --sign - --timestamp=none Payload/LersMonitor.app 2>&1 || \
              echo "WARNING: could not sign app bundle"
          fi

          # Sign embedded frameworks / dylibs if any
          if [ -d "Payload/LersMonitor.app/Frameworks" ]; then
            find "Payload/LersMonitor.app/Frameworks" -name "*.framework" -o -name "*.dylib" | while read -r f; do
              ldid -S "$f" 2>/dev/null || true
            done
          fi

          # Create the IPA (zip, store executables without recompression issues)
          zip -r -y -9 LersMonitor.ipa Payload
          rm -rf Payload

          echo "---- IPA contents ----"
          unzip -l LersMonitor.ipa | head -30

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LersMonitor-IPA
          path: iOS/LersMonitor.ipa
          retention-days: 14
