name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'iOS/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Info.plist & Project Spec
        run: |
          cat << 'EOF' > iOS/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>ru</string>
              <key>CFBundleDisplayName</key>
              <string>LersMonitor</string>
              <key>CFBundleExecutable</key>
              <string>LersMonitor</string>
              <key>CFBundleIdentifier</key>
              <string>com.lersmonitor.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>LersMonitor</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > iOS/project.yml
          name: LersMonitor
          options:
            bundleIdPrefix: com.lersmonitor
            deploymentTarget:
              iOS: "17.0"
          targets:
            LersMonitor:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: .
              info:
                path: Info.plist
              settings:
                base:
                  GENERATE_INFOPLIST_FILE: NO
                  PRODUCT_BUNDLE_IDENTIFIER: com.lersmonitor.app
                  CURRENT_PROJECT_VERSION: 1
                  MARKETING_VERSION: 1.0.0
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          EOF

      - name: Generate .xcodeproj
        working-directory: iOS
        run: xcodegen generate

      - name: Build Application (.app)
        working-directory: iOS
        run: |
          xcodebuild clean build \
            -project LersMonitor.xcodeproj \
            -scheme LersMonitor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        working-directory: iOS
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LersMonitor.app Payload/
          zip -r LersMonitor.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LersMonitor-IPA
          path: iOS/LersMonitor.ipa
          retention-days: 14
