name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'iOS/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Project Spec
        run: |
          cat << 'EOF' > iOS/project.yml
          name: LersMonitor
          options:
            bundleIdPrefix: com.lersmonitor
            deploymentTarget:
              iOS: "17.0"
            createIntermediateGroups: true
          targets:
            LersMonitor:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: .
                  excludes:
                    - "project.yml"
                    - "Info.plist"
                    - "build"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.lersmonitor.app
                  PRODUCT_NAME: LersMonitor
                  CURRENT_PROJECT_VERSION: 1
                  MARKETING_VERSION: 1.0.0
                  INFOPLIST_FILE: Info.plist
                  GENERATE_INFOPLIST_FILE: NO
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  ASSETCATALOG_COMPILER_APPICON_NAME: ""
                  ENABLE_BITCODE: NO
          EOF

      - name: Generate .xcodeproj
        working-directory: iOS
        run: xcodegen generate

      - name: Build Application (.app)
        working-directory: iOS
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project LersMonitor.xcodeproj \
            -scheme LersMonitor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            | xcbeautify || xcodebuild clean build \
            -project LersMonitor.xcodeproj \
            -scheme LersMonitor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64

      - name: Verify app bundle contents
        working-directory: iOS
        run: |
          APP="build/Build/Products/Release-iphoneos/LersMonitor.app"
          echo "---- Bundle tree ----"
          ls -la "$APP"
          echo "---- Executable check ----"
          if [ ! -f "$APP/LersMonitor" ]; then
            echo "ERROR: main executable LersMonitor is missing!"
            exit 1
          fi
          file "$APP/LersMonitor"
          echo "---- Info.plist keys ----"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$APP/Info.plist"

      - name: Package IPA
        working-directory: iOS
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/LersMonitor.app"
          rm -rf Payload LersMonitor.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/

          # Make sure the binary is executable
          chmod +x "Payload/LersMonitor.app/LersMonitor"

          # Ad-hoc sign with ldid (required for jailbroken / Sileo / Zebra installs)
          if ! command -v ldid >/dev/null 2>&1; then
            echo "ldid not found, installing via Homebrew..."
            brew install ldid || true
          fi
          if command -v ldid >/dev/null 2>&1; then
            ldid -S Payload/LersMonitor.app/LersMonitor
            echo "ldid signature applied"
          else
            echo "WARNING: ldid unavailable, app will be left unsigned"
          fi

          # Sign embedded frameworks / dylibs if any
          if [ -d "Payload/LersMonitor.app/Frameworks" ]; then
            find "Payload/LersMonitor.app/Frameworks" -name "*.framework" -o -name "*.dylib" | while read -r f; do
              ldid -S "$f" 2>/dev/null || true
            done
          fi

          # Create the IPA (zip, store executables without recompression issues)
          zip -r -y -9 LersMonitor.ipa Payload
          rm -rf Payload

          echo "---- IPA contents ----"
          unzip -l LersMonitor.ipa | head -30

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LersMonitor-IPA
          path: iOS/LersMonitor.ipa
          retention-days: 14
